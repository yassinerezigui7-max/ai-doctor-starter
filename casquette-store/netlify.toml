# Netlify config for the Casquette store.
# The Next.js runtime plugin is what makes the /api/order route work — it is
# deployed as a serverless function. Without it the route 404s and every order
# fails silently, so do not switch this to a static export.

[build]
  # Relative to this file; Netlify's base directory should be `casquette-store`.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Product images are immutable — their filenames contain a content hash, so a
# changed photo produces a new filename and can never be served stale.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The order endpoint must never be cached or indexed.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
